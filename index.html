<style>

.band{background:rgba(255,255,255,.14)}

.cell{background:rgba(255,255,255,.02);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 18px rgba(0,0,0,.3);color:#666}

.top{display:flex;gap:6px;height:104px}.top .timer{display:flex;flex-direction:column;justify-content:center}.hbtn{width:calc((100% - 18px)/4)!important;flex:none}.tile{height:48px;display:flex;flex-direction:column;justify-content:center;align-items:center}.adds .pill{height:48px;padding:0 2px}.adds .pill{color:var(--mut)}.hbtn{flex-direction:column;gap:5px}.hbtn small{color:var(--mut);font-size:12px;letter-spacing:.3px}.top .timer{flex:1;min-width:0}
.hbtn{width:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.35)}
.hbtn:active{filter:brightness(1.3);transform:scale(.97)}
.dlg.wide{width:min(430px,94vw);text-align:left}.dlg.wide h2{margin:0;text-align:center}
.hv .top2{display:flex;align-items:center;justify-content:space-between;min-height:34px;margin-bottom:10px}
.hv .top2 h2{flex:1}.hv .bk{color:#fff;padding:6px 8px 6px 0;font-size:16px;min-width:70px;text-align:left}.hv .sp2{min-width:70px}
.hs{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;font:400 16px var(--num);padding:10px 12px;margin-bottom:10px;outline:0;-webkit-user-select:text;user-select:text}
.hl{max-height:50vh;overflow-y:auto;margin-bottom:12px}
.hr{cursor:pointer}.hr .si{padding:12px 14px;justify-content:space-between}.ht small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.ch{color:var(--mut);font-size:22px}
.em{text-align:center;color:var(--mut)}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:7px;border-radius:10px;font-size:14px}.seg button.on{background:rgba(255,255,255,.28)}
.hg{display:grid;gap:6px;grid-template-columns:34px repeat(var(--n),minmax(0,1fr));align-items:center;margin-bottom:6px;font-variant-numeric:tabular-nums;text-align:center;font-size:14px}
.hg .c{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;border-radius:12px;background:rgba(142,142,147,.3)}.hg .c.o{background:rgba(255,255,255,.04);color:#555}.hg .m{color:var(--mut);font-size:12px}
.rk{display:grid;grid-template-columns:30px 1fr 56px 56px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);font-variant-numeric:tabular-nums;font-size:14px}.rk.head{color:var(--mut);font-size:12px}
.rk span:nth-child(n+3){text-align:right}
.md{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#000}.m0{background:#f3c96b}.m1{background:#c7c7cc}.m2{background:#c98a5a}.mn{color:var(--mut);background:none}
.nm{cursor:text}.hv .top2 h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}.ni{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.4);outline:0;color:#fff;font:400 19px var(--num);padding:2px 0;-webkit-user-select:text;user-select:text}
.rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hg .c,.rk{cursor:pointer}
.nmx{white-space:nowrap;display:inline-block;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis}.hg .c{overflow:hidden}.hg .c>span{max-width:100%;white-space:nowrap}.sl h2 svg{flex:none}
.hg .hn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);line-height:1.2;margin-bottom:1px}
</style></head>
<body>
<div id="app">
 <div class="top"><button class="hbtn" id="hist" aria-label="History"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4h4M12 7.5V12l3 2"/></svg><small>History</small></button><div class="timer" id="timer"><div class="t" id="tt">0:00.00</div><div class="l"><span id="hint"></span></div></div></div>
 <div class="tiles" id="tiles"></div>
 <div class="adds"><button class="pill" id="subRow">&minus; Heat</button><button class="pill" id="addRow">+ Heat</button><button class="pill" id="subLane">&minus; Lane</button><button class="pill" id="addLane">+ Lane</button></div>
 <div class="scroll"><div id="grid"></div></div>
 <div class="bar" id="bar"></div>
</div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const fmtT=s=>{const ms=Math.floor(Math.max(0,s)*1000);return Math.floor(ms/60000)+":"+pad(Math.floor(ms/1000)%60)+"."+pad(Math.floor(ms/10)%100)};
const fmtS=v=>":"+pad(v%60),fmtMS=v=>Math.floor(v/60)+":"+pad(v%60);
const fmtSp=x=>{const t=Math.floor(x*10);return t>=600?Math.floor(t/600)+":"+pad(Math.floor(t/10)%60)+"."+t%10:(t/10).toFixed(1)};
const S={startOn:0,apart:5,dist:50,iv:40,lanes:3,rows:5,act:{"0,0":1,"0,1":1,"0,2":1},spl:{},names:{},running:false,started:false,t0:0};
const R=(a,b,s)=>{const o=[];for(let x=a;x<=b;x+=s)o.push(x);return o};
const P={startOn:{t:"Start On",l:"Start On",vals:R(0,55,5),circ:1,chips:[],f:fmtS},
 apart:{t:"Seconds Apart",l:"Go Back",vals:[5,10,15,20,30,40,50,60,70,80,90,100,110,120],chips:[],f:v=>v<60?fmtS(v):fmtMS(v)},
 dist:{t:"Set Distance",l:"Distance",vals:R(25,200,25),chips:[],f:String},
 iv:{t:"Set Interval",l:"Interval",vals:R(5,600,5),chips:[],f:fmtMS}};
const now=()=>S.running?(performance.now()-S.t0)/1000:0;
const rowActive=r=>{for(let l=0;l<S.lanes;l++)if(S.act[r+","+l])return true;return false};
const cnt=(r,l)=>(S.spl[r+","+l]||[]).length;
function nextRow(l){let b=-1,bc=1e9;for(let r=0;r<S.rows;r++)if(S.act[r+","+l]&&cnt(r,l)<bc){bc=cnt(r,l);b=r}return b}
function nextT(r){const s=S.startOn+r*S.apart,n=now();return (!S.started||n<s)?s:s+S.iv*(Math.floor((n-s)/S.iv)+1)}
const ICON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="6" r="2"/><path d="M3 15c2 0 2-1.5 4-1.5S9 15 11 15s2-1.5 4-1.5 2 1.5 4 1.5M3 20c2 0 2-1.5 4-1.5S9 20 11 20s2-1.5 4-1.5 2 1.5 4 1.5M5 11l5-3 4 2"/></svg>';
const escA=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function cellIn(k){const a=S.spl[k]||[],tt=a.length?fmtSp(a[a.length-1]):"",n=S.act[k]&&S.names[k];
 return (n?`<span class="nmx">${escA(n)}</span>`:ICON)+(tt?`<b data-f="${tt}">${tt}</b>`:"")}
function fitTxt(el,max,min,w){el.style.fontSize=max+"px";let f=max;while(f>min&&el.scrollWidth>w){f-=.5;el.style.fontSize=f+"px"}}
function renderTiles(){$("#tiles").innerHTML=Object.keys(P).map(k=>`<button class="tile" data-k="${k}"><small>${P[k].l}</small><b>${P[k].f(S[k])}</b></button>`).join("")}
function renderGrid(){
 let h=`<div class="g" style="--n:${S.lanes}"><div class="badge" id="badge">#1</div>`;
 for(let l=0;l<S.lanes;l++)h+=`<div class="lh" data-n="${l+1}">Lane ${l+1}</div>`;
 h+="</div>";
 for(let r=0;r<S.rows;r++){
  h+=`<div class="g" style="--n:${S.lanes}"><div class="rl" data-r="${r}"></div>`;
  for(let l=0;l<S.lanes;l++){
   const k=r+","+l,on=S.act[k],a=S.spl[k]||[],nx=S.running&&on&&nextRow(l)===r;
   const wg=!!S.edit,tt=a.length?fmtSp(a[a.length-1]):"";
   h+=`<button class="cell${on?" on":""}${nx?" nx":""}${wg?" wig":""}" data-r="${r}" data-l="${l}">${cellIn(k)}</button>`;
  }
  h+="</div>";
 }
 $("#grid").innerHTML=h;fit();
}
function renderBar(){
 if(!S.running){$("#bar").style.setProperty("--n",1);$("#bar").innerHTML='<button class="big go" id="start">Start</button>';hint();return}
 hint();
 let h="";for(let l=0;l<S.lanes;l++)h+=`<button class="big sp" data-sp="${l}">Split</button>`;
 $("#bar").style.setProperty("--n",S.lanes);$("#bar").innerHTML=h;
}
const full=()=>{renderTiles();renderGrid();renderBar()};
function open(html,w){$("#dlg").classList.toggle("wide",!!w);$("#dlg").innerHTML=html;$("#ov").classList.add("on")}
const close=()=>$("#ov").classList.remove("on");
function picker(k){
 const p=P[k],vals=p.vals,n=vals.length,C=p.circ?5:1;
 let v=S[k],i0=vals.indexOf(v);if(i0<0)i0=vals.reduce((b,x,i)=>Math.abs(x-v)<Math.abs(vals[b]-v)?i:b,0);v=vals[i0];
 let items="";for(let c=0;c<C;c++)items+=vals.map(x=>`<div class="wi">${p.f(x)}</div>`).join("");
 open(`<h2>${p.t}</h2><div class="wrap"><div class="band"></div><div class="wheel" id="wh"><div class="pad"></div>${items}<div class="pad"></div></div></div>${p.chips.length?`<div class="chips">${p.chips.map(c=>`<button class="chip" data-c="${c}">${p.f(c)}</button>`).join("")}</div>`:""}`);
 const wh=$("#wh"),base=p.circ?2*n:0,pos=i=>(base+i)*50;let tm;
 wh.scrollTop=pos(i0);
 wh.onscroll=()=>{const idx=Math.round(wh.scrollTop/50),j=p.circ?((idx%n)+n)%n:Math.min(n-1,Math.max(0,idx));v=vals[j];S[k]=v;renderTiles();
  if(p.circ){clearTimeout(tm);tm=setTimeout(()=>{if(idx<2*n||idx>=3*n)wh.scrollTop=pos(j)},140)}};
 $("#dlg").onclick=e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){v=+t.dataset.c;wh.scrollTo({top:pos(vals.indexOf(v)),behavior:"smooth"})}
  else if(t.id==="cx")close();else if(t.id==="ok"){S[k]=v;close();renderTiles()}};
}
function endDialog(){
 open(`<h2>Save &amp; Reset?</h2><p>Are you sure you want to end this set? It will be saved to History.</p><div class="acts ctr"><button class="pr" id="cx">Cancel</button><button class="pr" id="ok">Save &amp; Reset</button></div>`);
 $("#dlg").onclick=e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="ok"){saveSet();if(wl){try{wl.release()}catch(e){}wl=null}S.running=false;S.started=false;S.spl={};S.names={};S.edit=null;$("#grid").classList.remove("editing");full()}close()};
}

try{const o=JSON.parse(localStorage.getItem(SK)||"null");if(o&&typeof o==="object"&&o.act&&o.spl&&o.lanes>0&&o.rows>0){Object.assign(S,o);S.names=S.names||{};if(S.running){if(!S.wall)S.running=S.started=false;else{S.t0=performance.now()-(Date.now()-S.wall);awake()}}}}catch(e){}
addEventListener("pagehide",persist);document.addEventListener("visibilitychange",()=>{if(document.hidden)persist()});
(function tick(){
 if(Date.now()-lastSave>1000)persist();
 const n=now();{const tt=$("#tt"),x=fmtT(n);if(tt.textContent!==x)tt.textContent=x;tt.classList.toggle("w",x.length>7)}
 const b=$("#badge");if(b)b.textContent="#"+(S.started?Math.max(0,Math.floor((n-S.startOn)/S.iv))+1:1);
 const act=[];document.querySelectorAll(".rl").forEach(el=>{const r=+el.dataset.r;if(rowActive(r))act.push({el,v:nextT(r)});else el.textContent=""});
 const ds=[...new Set(act.map(a=>Math.floor(a.v*100)))].sort((a,b)=>a-b);
 act.forEach(a=>{a.el.textContent=":"+pad(Math.floor(a.v)%60);const i=ds.indexOf(Math.floor(a.v*100));a.el.style.opacity=i===0?1:i===1?.6:.4;a.el.classList.toggle("hot",i===0)});
 requestAnimationFrame(tick);
})();
full();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
